<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bản tin truyền thông đội ngũ kinh doanh - CAPC</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F6FA;--card:#fff;--ink:#1E2430;--mute:#5F6B7A;--line:#DCE3EC;--acc:#0E4D95;--accbg:#E5EEF9;--or:#F58321;--orbg:#FEEBD8;--on:#fff;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1722;--card:#18222F;--ink:#E8EDF4;--mute:#9AA8BA;--line:#2A3646;--acc:#7DB2F0;--accbg:#1D3350;--orbg:#4A2E14;--on:#0F1722;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1722;--card:#18222F;--ink:#E8EDF4;--mute:#9AA8BA;--line:#2A3646;--acc:#7DB2F0;--accbg:#1D3350;--orbg:#4A2E14;--on:#0F1722;color-scheme:dark}
html{scroll-padding-top:64px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
.top{position:sticky;top:0;z-index:5;background:#0E4D95;color:#fff;padding:calc(8px + env(safe-area-inset-top,0px)) 16px 8px;display:flex;align-items:center;gap:14px}
.top img{height:40px;width:auto;display:block}
.top b{font-weight:600;font-size:15px;line-height:1.3;flex:1}
.top .em{color:#fff;font-weight:500;font-size:13px;text-decoration:none;border:1px solid #ffffff66;border-radius:8px;padding:5px 10px;white-space:nowrap}
.wrap{max-width:1000px;margin:0 auto;padding:20px 16px 56px}
.banner{display:block;width:100%;height:auto;border-radius:12px;margin:0 0 18px}
h1{font-size:24px;line-height:1.3;margin:0 0 4px;font-weight:700;color:var(--acc)}
.sub{color:var(--mute);margin:0 0 16px;font-size:14px}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 16px}
.kpi button{text-align:left;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:10px;padding:10px 12px}
.kpi button[aria-pressed=true]{background:var(--accbg);border-color:var(--acc)}
.kpi .n{display:block;font-size:24px;font-weight:700;line-height:1.2;color:var(--acc)}
.kpi .l{font-size:12.5px;color:var(--mute)}
.kpi button.o{border-left-color:var(--or)}.kpi button.o .n{color:var(--or)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=search],select{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:inherit;font:inherit}
input[type=search]{flex:1 1 240px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--or);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:9px 14px}
.seg button[aria-pressed=true]{background:var(--acc);color:var(--on);font-weight:600}
.fn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:9px 14px}
.fn[aria-pressed=true]{background:var(--or);border-color:var(--or);color:#1E2430;font-weight:600}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}
.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 14px;font-size:14px}
.tabs button[aria-selected=true]{background:var(--acc);border-color:var(--acc);color:var(--on);font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 12px;font-size:13.5px}
.chips button[aria-pressed=true]{background:var(--orbg);border-color:var(--or);color:var(--ink);font-weight:600}
.mon{font-size:13px;font-weight:600;color:var(--mute);margin:22px 0 8px}
.item{display:grid;grid-template-columns:96px 1fr;gap:16px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--gc,var(--acc));border-radius:10px;padding:14px 16px;margin:0 0 10px}
.g1{--gc:#0E4D95}.g2{--gc:#0F8B8D}.g3{--gc:#F58321}.g4{--gc:#C98A00}.g5{--gc:#7A5AA6}
.d{font-weight:600}.d small{display:block;color:var(--mute);font-weight:400;font-size:12.5px}
.txt{margin:0;font-weight:500}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;color:var(--mute);font-size:13px;margin-top:8px}
.tag{background:var(--accbg);color:var(--acc);border-radius:6px;padding:1px 8px;font-weight:600}
.st{border-radius:6px;padding:1px 8px;font-weight:600;font-size:12.5px;background:var(--line);color:var(--ink)}
.st.new{background:var(--or);color:#1E2430}.st.soon{background:var(--orbg);color:var(--ink);border:1px solid var(--or)}
.chkb{display:none;background:#FFE066;color:#1E2430;border-radius:6px;padding:1px 8px;font-size:12.5px}
.chk .chkb{display:inline}
a{color:var(--acc);font-weight:600}
.act{border:1px solid var(--line);background:none;border-radius:6px;padding:1px 10px;font-size:13px;color:var(--acc);font-weight:600}
mark{background:#FFE066;color:#1E2430;border-radius:3px;padding:0 1px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card);margin-top:12px}
table{border-collapse:collapse;width:100%;min-width:900px;font-size:13.5px}
th,td{text-align:left;vertical-align:top;padding:9px 10px;border-bottom:1px solid var(--line)}
th{color:var(--mute);font-weight:600;white-space:nowrap;background:var(--accbg)}
tr:last-child td{border-bottom:0}
.empty{padding:36px 8px;color:var(--mute);text-align:center}
.foot.note{font-size:12px;margin-top:6px}
.foot{color:var(--mute);font-size:13px;text-align:center;margin:32px 0 0}
@media (max-width:640px){.item{grid-template-columns:1fr;gap:6px}h1{font-size:20px}.kpi{grid-template-columns:repeat(2,1fr)}.top b{font-size:13px}.top{flex-wrap:wrap}.top .em{white-space:normal;font-size:12px}}
</style>
</head>

 tắc bảo hiểm bệnh hiểm nghèo số 77/QĐ - PTI (02/10/2026)", "eff": "2026-10-02", "ch": "Hỗ trợ kinh doanh", "url": "https://kms.ipas.com.vn/post/trien-khai-quy-tac-bao-hiem-benh-hiem-ngheo-so-77qd-pti-ngay-02102026.50de4e38-15e6-4be2-b0a3-d2f5f6af3054"}, {"date": "2026-06-24", "g": "Sản phẩm", "t": "PTI SOS", "txt": "Sản phẩm bảo hiểm FLEXICAR", "eff": "2026-03-23", "ch": "Hỗ trợ kinh doanh", "url": "https://kms.ipas.com.vn/post/san-pham-bao-hiem-rui-ro-chuyen-biet---flexicar.ef26a56c-74ae-488b-8fbf-6496a5ec83b4", "chk": "Hiệu lực sớm hơn ngày update"}, {"date": "2026-08-04", "g": "Sản phẩm", "t": "PTI SOS", "txt": "Chương trình hợp tác chiến lược PTI & HYUNDAI: “HYUNDAI AUTO CARE”", "eff": "2026-05-20", "ch": "Hỗ trợ kinh doanh", "url": "https://kms.ipas.com.vn/post/chuong-trinh-bao-hiem-lien-ket-hyundai-auto-care.c10e3cd0-341c-4c07-93c0-929040623e04", "chk": "Hiệu lực sớm hơn ngày update"}, {"date": "2026-09-30", "g": "Vận hành", "t": "", "txt": "Hỗ trợ bảo lãnh ngoài giờ hành chính", "eff": "2026-10-01", "ch": "Hỗ trợ kinh doanh", "url": "https://kms.ipas.com.vn/post/pti--thong-bao-ho-tro-bao-lanh-ngoai-gio-hanh-chinh.295d2604-7430-491e-a823-094b8c225619"}, {"date": "2026-11-04", "g": "Cơ chế", "t": "", "txt": "Điều chỉnh payout xe cơ giới nghiệp vụ XO.1 & XO.3", "eff": "2026-09-01", "ch": "Hỗ trợ kinh doanh", "url": "https://kms.ipas.com.vn/post/cv-23pti-kdxcg-dieu-chinh-payout-xo1xo3-kenh-ca.5225d08c-f547-47ed-aa92-e75a2d220fdb", "chk": "Hiệu lực sớm hơn ngày update"}, {"date": "2026-11-04", "g": "Vận hành", "t": "", "txt": "Hướng dẫn nhập đơn Bảo hiểm học sinh (CN.5.2) trên Portal", "eff": "2026-08-17", "ch": "Hỗ trợ kinh doanh", "url": "https://kms.ipas.com.vn/post/huong-dan-nhap-don-bao-hiem-hoc-sinh-cn52-tren-portal--ap-dung-tu-17082026.37e63547-2e3c-41ec-98e1-9e6f0092508f"}, {"date": "2026-10-26", "g": "Đào tạo", "t": "", "txt": "Áp dụng quy trình iLEAD đề xuất mở lượt thi LMS", "eff": "2026-10-26", "ch": "IPAM", "url": "https://kms.ipas.com.vn/document/NmFmYWQ0MWYtZjhlYi00NTU4LWFlM2EtMTJhOTgyYWE5YTI5?tmp=dHJ1ZQ==&tmp2=cGRm"}, {"date": "2026-10-21", "g": "Đào tạo", "t": "", "txt": "Chương trình đồng hành WELCOME ONBOARD", "eff": "2026-10-22", "ch": "iCare", "url": ""}];
const GROUPS=['Tất cả','Sản phẩm','Vận hành','Cơ chế','Chương trình thi đua','Đào tạo'];
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d');
const fd=i=>i.split('-').reverse().join('/');
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const now=new Date(),T=now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate());
const ago=d=>Math.round((new Date(T)-new Date(d))/864e5);
const stOf=x=>x.eff>T?'soon':'active';
const isNew=x=>{const a=ago(x.date);return a>=0&&a<=7};
const cat=x=>x.g+(x.t?' / '+x.t:'');
DATA.sort((a,b)=>b.date.localeCompare(a.date)||b.eff.localeCompare(a.eff));
DATA.forEach((x,i)=>{x.i=i;x.s=norm([cat(x),x.txt,fd(x.date),fd(x.eff),x.ch].join(' '))});
const hl=(s,q)=>{if(!q)return esc(s);let n='',map=[];for(let i=0;i<s.length;i++){const c=norm(s[i]);for(let k=0;k<c.length;k++){n+=c[k];map.push(i)}}let out='',pos=0,from=0,j;while((j=n.indexOf(q,from))>-1){const a=map[j],b=map[j+q.length-1]+1;if(a<pos){from=j+1;continue}out+=esc(s.slice(pos,a))+'<mark>'+esc(s.slice(a,b))+'</mark>';pos=b;from=j+q.length}return out+esc(s.slice(pos))};
const S={g:'Tất cả',t:'Tất cả',q:'',m:'Tất cả',f:'all',v:'card'};
const stBadge=x=>isNew(x)?'<span class="st new">Mới</span>':'';
const chk=x=>x.chk?`<span class="chkb" title="${esc(x.chk)}">Cần kiểm tra: ${esc(x.chk)}</span>`:'';
const link=x=>x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">Nguồn tham khảo</a>`:'';
const rel=x=>x.kw?`<button class="act" data-kw="${esc(x.kw)}">Tin liên quan</button>`:'';
function render(){
  const q=norm(S.q.trim());
  $('tabs').innerHTML=GROUPS.map(g=>`<button role="tab" aria-selected="${S.g===g}" data-g="${g}">${g}</button>`).join('');
  const topics=[...new Set(DATA.filter(x=>x.g==='Sản phẩm'&&x.t).map(x=>x.t))].sort();
  $('chips').innerHTML=S.g==='Sản phẩm'?['Tất cả',...topics].map(t=>`<button aria-pressed="${S.t===t}" data-t="${t}">${t}</button>`).join(''):'';
  $('fn').setAttribute('aria-pressed',S.f==='new');
  const items=DATA.filter(x=>(S.m==='Tất cả'||x.date.startsWith(S.m))&&(!q||x.s.includes(q))&&(S.g==='Tất cả'||x.g===S.g)&&(S.g!=='Sản phẩm'||S.t==='Tất cả'||x.t===S.t)&&(S.f==='all'||isNew(x)));
  if(!items.length){$('list').innerHTML='<div class="empty">Không có tin phù hợp. Xóa từ khóa hoặc chọn nhóm khác.</div>';return}
  let out='';
  if(S.v==='table'){
    out='<div class="tw"><table><thead><tr><th>Ngày update</th><th>Phân loại</th><th>Nội dung chính</th><th>Hiệu lực từ</th><th>Trạng thái</th><th>Đơn vị gửi</th><th>Nguồn</th></tr></thead><tbody>'+items.map(x=>`<tr><td>${hl(fd(x.date),q)}</td><td>${hl(cat(x),q)}</td><td>${hl(x.txt,q)} ${chk(x)}</td><td>${hl(fd(x.eff),q)}</td><td>${stBadge(x)}</td><td>${hl(x.ch,q)}</td><td>${link(x)} <button class="act" data-c="${x.i}">Sao chép</button></td></tr>`).join('')+'</tbody></table></div>';
  }else{
    let last='';
    items.forEach(x=>{
      const m=`Tháng ${+x.date.slice(5,7)}/${x.date.slice(0,4)}`;
      if(m!==last){out+=`<h2 class="mon">${m}</h2>`;last=m}
      out+=`<article class="item g${GROUPS.indexOf(x.g)}"><div class="d">${hl(fd(x.date),q)}<small>Ngày update</small></div><div><p class="txt">${hl(x.txt,q)}</p><div class="meta"><span class="tag">${hl(cat(x),q)}</span>${stBadge(x)}<span>Hiệu lực từ: ${hl(fd(x.eff),q)}</span><span>Gửi bởi: ${hl(x.ch,q)}</span>${chk(x)}</div><div class="meta">${link(x)}<button class="act" data-c="${x.i}">Sao chép</button>${rel(x)}</div></div></article>`;
    });
  }
  $('list').innerHTML=out;
}
const MS=[...new Set(DATA.map(x=>x.date.slice(0,7)))].sort().reverse();
$('m').innerHTML='<option value="Tất cả">Tất cả thời gian</option>'+MS.map(k=>`<option value="${k}">Tháng ${+k.slice(5)}/${k.slice(0,4)}</option>`).join('');
$('sub').textContent='Cập nhật thông tin mới dành cho đội ngũ kinh doanh';
document.body.classList.toggle('chk',location.hash==='#kiemtra');
$('m').addEventListener('change',e=>{S.m=e.target.value;render()});
$('q').addEventListener('input',e=>{S.q=e.target.value;render()});
function copy(t,b){const ok=()=>{const o=b.textContent;b.textContent='Đã sao chép';setTimeout(()=>b.textContent=o,1500)};
  const fb=()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');ok()}catch(e){}a.remove()};
  navigator.clipboard?navigator.clipboard.writeText(t).then(ok,fb):fb()}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const d=b.dataset;
  if(d.c!==undefined){const x=DATA[+d.c];copy([x.txt,'Hiệu lực từ: '+fd(x.eff),x.url||''].filter(Boolean).join('\n'),b);return}
  if(d.kw){S.q=d.kw;$('q').value=d.kw;S.g='Tất cả';S.f='all';S.m='Tất cả';$('m').value='Tất cả'}
  else if(d.g){S.g=d.g;S.t='Tất cả'}
  else if(d.t){S.t=d.t}
  else if(d.f){S.f=S.f==='new'?'all':'new'}
  else if(d.v){S.v=d.v}
  else return;
  render();
});
render();
</script>
</body>
</html>
